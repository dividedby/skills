# Roadmap mirror (TEMPLATE — the roadmap skill installs this into a consumer
# repo's `.github/workflows/`; it is NOT active on the skills repo, which has no
# roadmap doc). Renders the working-tree roadmap into a read-only, machine-owned
# mirror issue body on every push that touches the doc, commit-if-changed (no
# diff -> no write). Deterministic: stdlib `gh` calls only, no `claude -p`, so the
# cost-ledger rule does not apply. ADR 0020 (the doc stays the source of record;
# this is only a read-only mirror) + ADR 0004 (stdlib helpers).
#
# After copying, edit the three config values below:
#   - the `paths:` filter to your roadmap doc's path,
#   - MIRROR_ISSUE to the pinned mirror issue number,
#   - ROADMAP_PATH to the same doc path.
# `roadmap-mirror.py`'s own ROADMAP_PATH default can be left as-is — this passes
# the path explicitly.
name: roadmap-mirror

on:
  push:
    branches: [main]
    paths:
      - "docs/plans/roadmap.md"   # <-- edit to your roadmap doc path
  workflow_dispatch:

# Serialize so two quick pushes can't race the commit-if-changed PATCH.
concurrency:
  group: roadmap-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIRROR_ISSUE: "0"             # <-- edit to the pinned mirror issue number
      ROADMAP_PATH: "docs/plans/roadmap.md"  # <-- edit to your roadmap doc path
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Render and update the mirror (commit-if-changed)
        run: |
          python3 -B .github/scripts/roadmap-mirror.py "$MIRROR_ISSUE" "$ROADMAP_PATH"
