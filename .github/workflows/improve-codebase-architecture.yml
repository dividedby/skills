name: Improve Codebase Architecture

# Thin caller stub (#382). Body lives in improve-codebase-architecture-reusable.yml.
# Local-path `./` ref means skills runs its own latest body (the canary) while
# consumers pin @claude-loops-v1.
# Cron: 00:05 UTC Mon/Wed/Sat = 19:05 CT Sun/Tue/Fri (3×/week).

on:
  schedule:
    - cron: "5 0 * * 1,3,6"
  workflow_dispatch:

jobs:
  run:
    # The calling job must grant the token scopes the reusable body needs: a
    # called workflow can't be granted more than the caller holds, and the repo
    # default is read-only — without this the body's `issues: write` request
    # exceeds the caller's grant and the run startup-fails.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/improve-codebase-architecture-reusable.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
