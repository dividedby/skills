name: Improve Codebase Architecture

on:
  schedule:
    # 00:05 UTC Saturday = 19:05 CT Friday. Weekly, in the Friday-evening consumer
    # window — slot = sha1("skills/improve-codebase-architecture") within the Sat
    # 00–04 UTC (= Fri 19–23 CT) band, so onboarding a Consumer needs no schedule
    # coordination (agent-research ADR 0022 hash-stagger). The Saturday-UTC slot IS
    # Friday evening CT: one `* * 6` mask avoids the UTC-midnight day-of-week
    # straddle. Weekly (was weekdays) under the agent-research cost rebalance
    # (2026-06-08) — a daily arch-review found little run-to-run on a slow-churn
    # repo, for sonnet spend that added up under the $100 Agent SDK credit.
    - cron: "5 0 * * 6"
  workflow_dispatch:

# This workflow is the thin **workflow envelope** (ADR 0014): cron, permissions,
# tokens, tool scoping, and a clone-and-invoke body. The drift-prone logic — the
# stream-json cost scrape and the <output>/<body> publish seam — lives in the
# fetched-fresh **proposal-loop harness** (`harness/cli.py`), not inline here, so
# one fix reaches every loop. In *this* repo the harness arrives with the
# `ref: main` checkout (the checkout IS the fresh harness); a downstream repo
# instead clones dividedby/skills into a temp dir — see
# docs/onboarding/proposal-loop-harness.md.

jobs:
  improve-codebase-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: improve-codebase-architecture
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LABEL: source:architecture-review

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Install Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install /improve-codebase-architecture skill
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 https://github.com/mattpocock/skills.git "$tmp/mattpocock-skills"
          mkdir -p ~/.claude/skills
          cp -R "$tmp/mattpocock-skills/skills/engineering/improve-codebase-architecture" ~/.claude/skills/
          test -f ~/.claude/skills/improve-codebase-architecture/SKILL.md
          echo "Installed skill from mattpocock/skills@$(git -C "$tmp/mattpocock-skills" rev-parse --short HEAD)"

      - name: Fetch depth rubric from mattpocock/skills
        run: |
          set -euo pipefail
          # ADR 0020: the depth concepts (deep/shallow modules, seams, deletion test)
          # are fetched fresh from mattpocock/skills@main rather than hand-modeled in
          # the skeleton, so the loop always runs against mattpocock's latest. Float
          # policy: no SHA pin — accepted tradeoff (see ADR 0020). Hard-fail on any
          # fetch error, consistent with the arch-review-context.md gate (ADR 0016):
          # an unattended run with a missing or partial rubric would produce unsound
          # depth proposals.
          LANG_URL="https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/improve-codebase-architecture/LANGUAGE.md"
          DEEP_URL="https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/improve-codebase-architecture/DEEPENING.md"
          if ! curl -fsSL "$LANG_URL" -o "$RUNNER_TEMP/depth-LANGUAGE.md"; then
            echo "ERROR: failed to fetch depth rubric LANGUAGE.md from mattpocock/skills" >&2
            exit 1
          fi
          if ! curl -fsSL "$DEEP_URL" -o "$RUNNER_TEMP/depth-DEEPENING.md"; then
            echo "ERROR: failed to fetch depth rubric DEEPENING.md from mattpocock/skills" >&2
            exit 1
          fi
          echo "Fetched depth rubric files:"
          wc -l "$RUNNER_TEMP/depth-LANGUAGE.md" "$RUNNER_TEMP/depth-DEEPENING.md"

      - name: Run /improve-codebase-architecture
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # The system prompt is assembled from three parts (ADR 0016, ADR 0020):
          #   1. The fetched-fresh scope-free SKELETON in harness/prompts/ (the
          #      shared proposal discipline + three-lens framing + lockstep
          #      <output>/<body> schema). Scope-free: depth concepts are not modeled
          #      in the skeleton; they forward-reference part 2.
          #   2. The DEPTH RUBRIC fetched fresh from mattpocock/skills@main
          #      (LANGUAGE.md + DEEPENING.md). Assembled by the preceding step;
          #      hard-fails if absent — same spirit as the test -f below.
          #   3. This repo's local Repo-context INCLUDE. Scope is load-bearing —
          #      a skeleton with no scope reviews blindly — so a missing include
          #      HARD-FAILS the run, like the test -f on the skill above.
          test -f .github/arch-review-context.md
          test -f "$RUNNER_TEMP/depth-LANGUAGE.md"
          test -f "$RUNNER_TEMP/depth-DEEPENING.md"
          # The agent is read-only: it explores, decides, and emits a single
          # <output> JSON block plus raw <body-N> blocks (see prompt). It does NOT
          # file the issues — the Publish step does, via the harness, which enforces
          # the ≤5-issues-per-run cap (ADR 0019) and the label in code. gh access is
          # scoped to read-only subcommands so the agent *cannot* create an issue itself.
          # --output-format stream-json --verbose: stream every event so a hung run
          # leaves a trace (plain json buffers) and the final result event (with
          # total_cost_usd) lands before claude exits — cost captured even on failure.
          # pipefail propagates an agent failure; the Digest step still runs (always).
          # --model is deliberately pinned to claude-sonnet-4-6 (not the floating
          # `sonnet` alias) so an unattended run can't silently inherit the next
          # Sonnet release — bump only after testing the prompts against the new
          # model (#180).
          # --max-budget-usd is a per-run spend backstop, sized ~2.5–3× the
          # observed max from the cost ledger — never trips a healthy run, caps
          # a runaway well below an unbounded 20-minute spend (#181).
          claude -p \
            --output-format stream-json --verbose \
            --model claude-sonnet-4-6 \
            --max-budget-usd 3.00 \
            --permission-mode acceptEdits \
            --allowedTools "Bash(gh issue list:*) Bash(gh issue view:*) Bash(gh search:*) Bash(gh api:*) Bash(git:*) Read Grep Glob WebSearch WebFetch" \
            --append-system-prompt "$(
              cat harness/prompts/improve-codebase-architecture.md
              printf '\n\n---\n\n## Depth rubric (fetched from mattpocock/skills)\n\n'
              cat "$RUNNER_TEMP/depth-LANGUAGE.md"
              printf '\n\n'
              cat "$RUNNER_TEMP/depth-DEEPENING.md"
              printf '\n\n---\n\n'
              cat .github/arch-review-context.md
            )" \
            "Run the daily architecture-review pass. Follow the instructions in the system prompt." \
            | tee "$RUNNER_TEMP/agent.jsonl"

      - name: Digest the run (result log + cost ledger)
        if: always()
        run: |
          set -euo pipefail
          # JSONL -> clean result text + the total_cost_usd=… ledger line the
          # cross-repo cost hub scrapes. Best-effort by construction (exit 0 even
          # with no result event), so it runs on a failed agent run too.
          python3 harness/cli.py digest \
            --jsonl "$RUNNER_TEMP/agent.jsonl" \
            --result-out "$RUNNER_TEMP/agent.log" \
            --cost-out "$RUNNER_TEMP/agent.cost"

      - name: Publish proposal
        id: publish
        run: |
          set -euo pipefail
          # Parse <output>/<body-N>, file <=5 labeled issues (cap in code, ADR
          # 0019), write the rich step summary, emit issue_url(s). Fails loudly
          # (exit 1) on a missing/garbled block — the failure() Summarise step
          # below then surfaces the raw log.
          python3 harness/cli.py publish \
            --log "$RUNNER_TEMP/agent.log" \
            --label "$LABEL" \
            --label-description "Issues proposed by the automated architecture-review workflow" \
            --cost-file "$RUNNER_TEMP/agent.cost" \
            --heading "Architecture review"

      - name: Summarise a failed run
        if: failure()
        run: |
          {
            echo "## Architecture review"
            echo ""
            echo "**Cost:** $(cat "$RUNNER_TEMP/agent.cost" 2>/dev/null || echo "n/a")"
            echo ""
            echo "**No valid \`<output>\` block, or the agent crashed** — last result text:"
            echo ""
            echo '```'
            tail -n 50 "$RUNNER_TEMP/agent.log" 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
