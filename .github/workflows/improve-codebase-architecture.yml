name: Improve Codebase Architecture

on:
  schedule:
    # 11:17 UTC weekdays = 06:17 CT. Off-the-hour + pre-peak slot to reduce GitHub cron delay.
    - cron: "17 11 * * 1-5"
  workflow_dispatch:

jobs:
  improve-codebase-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: improve-codebase-architecture
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LABEL: source:architecture-review

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install /improve-codebase-architecture skill
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 https://github.com/mattpocock/skills.git "$tmp/mattpocock-skills"
          mkdir -p ~/.claude/skills
          cp -R "$tmp/mattpocock-skills/skills/engineering/improve-codebase-architecture" ~/.claude/skills/
          test -f ~/.claude/skills/improve-codebase-architecture/SKILL.md
          echo "Installed skill from mattpocock/skills@$(git -C "$tmp/mattpocock-skills" rev-parse --short HEAD)"

      - name: Ensure provenance label exists
        run: |
          gh label create "$LABEL" \
            --color "5319E7" \
            --description "Issues proposed by the automated architecture-review workflow" \
            >/dev/null 2>&1 || true

      - name: Run /improve-codebase-architecture
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # --output-format json so the run emits total_cost_usd; the agent's
          # final message is pulled back out into agent.log for the summary.
          # Cost is recorded to track monthly Agent SDK spend (see #58).
          # Capture claude's exit code WITHOUT aborting: a failed run still spends
          # Agent SDK credit and still writes total_cost_usd to agent.json, so we
          # must extract+log the cost before propagating the failure (exit $rc).
          rc=0
          claude -p \
            --output-format json \
            --permission-mode acceptEdits \
            --allowedTools "Bash(gh:*) Bash(git:*) Read Grep Glob WebSearch WebFetch" \
            --append-system-prompt "$(cat .github/workflows/prompts/improve-codebase-architecture.md)" \
            "Run the daily architecture-review pass. Follow the instructions in the system prompt." \
            > "$RUNNER_TEMP/agent.json" || rc=$?
          jq -r '.result // ""' "$RUNNER_TEMP/agent.json" 2>/dev/null | tee "$RUNNER_TEMP/agent.log" || true
          jq -r '"total_cost_usd=\(.total_cost_usd // "n/a")  duration_ms=\(.duration_ms // "n/a")  num_turns=\(.num_turns // "n/a")"' \
            "$RUNNER_TEMP/agent.json" 2>/dev/null | tee "$RUNNER_TEMP/agent.cost" || true
          exit $rc

      - name: Summarise run
        if: always()
        run: |
          {
            echo "## Architecture review"
            echo ""
            echo "**Cost:** $(cat "$RUNNER_TEMP/agent.cost" 2>/dev/null || echo "n/a")"
            echo ""
            echo '```'
            tail -n 50 "$RUNNER_TEMP/agent.log" 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
