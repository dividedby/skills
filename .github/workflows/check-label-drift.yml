name: Check Label Drift

# Weekly detector for label-convention doc drift across consumer repos.
# Reads each consumer's docs/agents/ label docs via the GitHub Contents API;
# checks for four drift shapes; opens a `label-drift` issue in dividedby/skills
# for any drifted repo. Report only — no hard gate, no consumer-repo mutation.
#
# Prerequisite: ISSUES_TOKEN secret (fine-grained PAT, owner dividedby, all repos,
# permissions: Contents:Read + Issues:Write). Until the secret is created the job
# exits 0 and does nothing (graceful no-op; the script prints a clear notice to
# the log).
#
# Reference: docs/agents/vendored-workflows.md, tools/check_label_drift.py

on:
  schedule:
    # Sunday 05:00 UTC — self-staggered 1h after check-workflow-drift (Sun 04:00 UTC)
    # to avoid competing with the same job; both run outside the proposal-loop
    # windows (Mon/Wed/Sat 00–04 UTC and first-Monday 13:xx UTC).
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-label-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run label drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_label_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"
