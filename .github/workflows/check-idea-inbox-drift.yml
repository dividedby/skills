name: Check Idea-Inbox Drift

# Weekly detector for idea-inbox.md structural drift across carrier repos.
# Reads each carrier's docs/agents/idea-inbox.md via the GitHub Contents API;
# checks eight canonical structural anchors; opens an `idea-inbox-drift` issue
# in dividedby/skills for any drifted repo. Report only — no hard gate, no
# carrier-repo mutation.
#
# Prerequisite: ISSUES_TOKEN secret (fine-grained PAT, owner dividedby, all repos,
# permissions: Contents:Read + Issues:Write). Until the secret is created the job
# exits 0 and does nothing (graceful no-op; the script prints a clear notice to
# the log).
#
# Reference: docs/agents/vendored-workflows.md, tools/check_idea_inbox_drift.py

on:
  schedule:
    # Sunday 06:00 UTC — self-staggered 1h after check-label-drift (Sun 05:00 UTC),
    # 2h after check-workflow-drift (Sun 04:00 UTC); all three run outside the
    # proposal-loop windows (Mon/Wed/Sat 00–04 UTC and first-Monday 13:xx UTC).
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-idea-inbox-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run idea-inbox drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_idea_inbox_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"
