name: Staleness Review

# Thin caller stub (#382). Body lives in staleness-review-reusable.yml.
# Local-path `./` ref means skills runs its own latest body (the canary) while
# consumers pin @claude-loops-v1. The first-Monday gate now lives in the reusable body.
# Cron: first Monday of the month, 13:08 UTC = 08:08 CT.

on:
  schedule:
    - cron: "8 13 * * 1"
  workflow_dispatch:

jobs:
  run:
    # The calling job must grant the token scopes the reusable body needs: a
    # called workflow can't be granted more than the caller holds, and the repo
    # default is read-only — without this the body's `issues: write` request
    # exceeds the caller's grant and the run startup-fails.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/staleness-review-reusable.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
