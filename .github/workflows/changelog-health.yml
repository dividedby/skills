name: Changelog Health

# Centralized weekly changelog-health evaluator (#457, fanned out to 6 repos in #458).
#
# Flag-not-rewrite advisory loop: reads each enrolled repo's CHANGELOG.md against
# recent git log and the fleet changelog rubric (docs/agents/changelog-guideline.md),
# and files at most one advisory issue per repo proposing ## [Unreleased] lines
# and/or citing rubric violations. Never edits CHANGELOG.md; never a CI gate.
#
# Host repo: dividedby/skills.
# Enrolled repos: sourced from harness/changelog-health/enrolled-repos.txt
#   (one owner/repo per line; #-comments and blank lines ignored). The `prepare`
#   job reads that file and emits the matrix; enroll a repo by adding a line there.
# Fan-out: GitHub Actions matrix — one job per enrolled repo per weekly run.
#
# Harness: read fresh from the LOCAL skills checkout — skills IS the host, so the
# harness lives at $GITHUB_WORKSPACE/harness. Consumer reusable bodies clone
# skills to get the harness; this workflow skips that clone step entirely.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — agent authorization (read-only agent run).
#   ISSUES_TOKEN            — fleet write PAT (Issues:RW + Contents:read across all
#                             repos, ADR 0032); used by the checkout step to clone
#                             non-skills repos and by the publish step to file issues.
#                             The agent itself never holds a write credential — the
#                             default token is contents:read only.
#
# ADR 0014 (fetched-fresh harness): harness is read from the local checkout,
#   not vendored — a fix to cli.py reaches the next scheduled run automatically.
# ADR 0019 (budget/cap): --max-budget-usd 4.00 backstop per repo (6 jobs/run);
#   single-open-advisory dedup is enforced in-code via `cli.py publish --dedup-open`,
#   not in the prompt.
# No CI gate: this loop is advisory-only.

on:
  schedule:
    # Hash-staggered slot: offset = int(sha1("skills/changelog-health")[:6], 16)
    # = 0x412dfd = 4271613 → minute = 4271613 % 60 = 33,
    # hour = (4271613 // 60) % 4 = 1 (within the 00–04 UTC off-peak band).
    # Weekly on Thursday (day 4) — free of the MWF proposal loops (1,3,6)
    # and the Sunday drift checks (0), keeping advisory issues spaced within
    # one UTC day.
    - cron: "33 1 * * 4"
  workflow_dispatch:

jobs:
  # Read the enrolled-repos list into a JSON array the matrix below fans out over.
  # Single source of truth: harness/changelog-health/enrolled-repos.txt — enroll a
  # repo by adding a line there (setup-dividedby-skills Concern G does this), no
  # workflow edit needed.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout skills repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read enrolled repos
        id: read
        run: |
          set -euo pipefail
          # Strip CR first (CRLF guard), then drop #-comments and blank/whitespace
          # lines; jq packs the survivors into a compact JSON array.
          # `|| true` on each grep: a no-match exit 1 is the legitimate empty/all-
          # comments case — without it, `set -o pipefail` would kill the step red
          # (matrix never written, warning never reached) and the dependent job
          # would skip as a *failure* instead of the intended clean skip.
          matrix=$(tr -d '\r' < harness/changelog-health/enrolled-repos.txt \
            | { grep -v '^#' || true; } \
            | { grep -v '^[[:space:]]*$' || true; } \
            | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Enrolled repos: $matrix"
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            echo "::warning::enrolled-repos.txt resolved to an empty list — no changelog-health jobs will run (skills should always be enrolled)."
          fi

  changelog-health:
    needs: [prepare]
    # Empty-list guard: fromJSON('[]') errors a GHA matrix, so skip the whole job.
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: changelog-health-${{ matrix.repo }}
      cancel-in-progress: false
    permissions:
      contents: read

    env:
      GH_REPO: ${{ matrix.repo }}
      LABEL: source:changelog-health
      SKILLS_DIR: ${{ github.workspace }}
      TARGET_DIR: ${{ matrix.repo == 'dividedby/skills' && github.workspace || format('{0}/target', github.workspace) }}

    steps:
      - name: Checkout skills repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Full history needed so the agent can run git log back to the last
          # dated changelog section without a shallow-clone truncation.

      # Target cloned only for non-skills jobs; skills uses its own checkout as the target.
      - name: Checkout target repo
        if: matrix.repo != 'dividedby/skills'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.ISSUES_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          set -euo pipefail
          # Unpinned trusted-vendor dependency (#308): no per-version installer URL or
          # checksum is published to consume; accepted on the same trust root as the
          # CLAUDE_CODE_OAUTH_TOKEN issuer that authorizes this job.
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The harness lives in the local checkout — no git clone needed.
      # (Consumer reusable bodies clone dividedby/skills to get the harness;
      # this centralized host workflow reads it directly from $GITHUB_WORKSPACE.)
      - name: Set harness path
        run: echo "HARNESS=$GITHUB_WORKSPACE/harness" >> "$GITHUB_ENV"

      - name: Run changelog-health evaluator
        # CWD = TARGET_DIR so bare git log and Read CHANGELOG.md hit the target repo.
        # Do NOT use `git -C` — the allowedTools match bare `git log`; CWD=TARGET_DIR
        # is how the target is selected.
        #
        # Rubric is read from $SKILLS_DIR (absolute path in the skills checkout);
        # CHANGELOG.md and git log are read from CWD (= the target clone).
        # The agent runs NO gh and files nothing — gh is absent from the allowlist,
        # so all gh subcommands are denied by default. Dedup (single-open-advisory)
        # is enforced in-code by the publish step via --dedup-open.
        #
        # git is scoped to read-only subcommands (log/diff/show/ls-files/status).
        # Do NOT add `gh api` here — it is a write primitive that POSTs issues
        # directly, bypassing the single-advisory invariant (#306).
        # WebSearch/WebFetch are excluded: the rubric is in the local checkout,
        # not fetched by the model, so web access only adds an exfil surface
        # for an injected prompt.
        #
        # --output-format stream-json --verbose: stream every event so a hung
        # run leaves a trace and the final result event (with total_cost_usd)
        # lands before claude exits — cost captured even on failure.
        # --model pinned to the exact model ID — a floating alias silently
        # inherits the next release into an unattended loop (skills#180).
        # --max-budget-usd is a per-run spend backstop (skills#181): sized
        # ~3× the expected max; never trips a healthy run, caps a runaway.
        working-directory: ${{ env.TARGET_DIR }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          claude -p \
            --output-format stream-json --verbose \
            --model claude-sonnet-5 \
            --max-budget-usd 4.00 \
            --allowedTools "Bash(git log:*) Bash(git diff:*) Bash(git show:*) Bash(git ls-files:*) Bash(git status:*) Read Grep Glob" \
            --append-system-prompt "$(cat "$HARNESS/prompts/changelog-health.md")" \
            "Run the weekly changelog-health pass for ${GH_REPO}. The repo under evaluation is checked out at your current working directory. Read the grading rubric from ${SKILLS_DIR}/docs/agents/changelog-guideline.md. Follow the instructions in the system prompt." \
            | tee "$RUNNER_TEMP/agent.jsonl"

      - name: Digest the run (result log + cost ledger)
        if: always()
        run: |
          set -euo pipefail
          # JSONL -> clean result text + the total_cost_usd=… ledger line, via
          # the local harness. Best-effort by construction (exit 0 even with no
          # result event), so it runs on a failed agent run too.
          python3 "$HARNESS/cli.py" digest \
            --jsonl "$RUNNER_TEMP/agent.jsonl" \
            --result-out "$RUNNER_TEMP/agent.log" \
            --cost-out "$RUNNER_TEMP/agent.cost"

      - name: Publish advisory
        id: publish
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GH_REPO: ${{ env.GH_REPO }}
        run: |
          set -euo pipefail
          # Parse <output>/<body>, file at most one labeled advisory issue.
          # --dedup-open enforces the single-open-advisory invariant in-code:
          # if an open issue with --label already exists in --repo, publish skips
          # filing entirely. Writes the rich step summary. Fails loudly (exit 1)
          # on a missing/garbled block — the failure() step below then surfaces
          # the raw log.
          #
          # ISSUES_TOKEN (not GITHUB_TOKEN): the fleet write PAT (ADR 0032,
          # Issues:RW across all enrolled repos).
          python3 "$HARNESS/cli.py" publish \
            --log "$RUNNER_TEMP/agent.log" \
            --label "$LABEL" \
            --label-description "Filed by the changelog-health loop" \
            --label-color 5319E7 \
            --cost-file "$RUNNER_TEMP/agent.cost" \
            --heading "Changelog health" \
            --dedup-open

      - name: Summarise a failed run
        if: failure()
        run: |
          {
            echo "## Changelog health: ${{ matrix.repo }}"
            echo ""
            echo "**Cost:** $(cat "$RUNNER_TEMP/agent.cost" 2>/dev/null || echo "n/a")"
            echo ""
            echo "**No valid \`<output>\` block, or the agent crashed** — last result text:"
            echo ""
            echo '```'
            tail -n 50 "$RUNNER_TEMP/agent.log" 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
