name: gate

# Single always-run merge gate — the sole CI workflow for tests. The three
# per-area workflows this once complemented (hook-self-tests, harness-tests, and
# a path-filtered lib-tests workflow) were path-filtered subsets of this suite that
# also re-ran on push, double-running the same tests gate already covers at PR
# time; they were removed. The `gate` job has no path filter and runs every
# stdlib self-test in the repo in one sub-second pass; `ci-ok` below is the check
# the default-branch ruleset requires.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run all standalone self-tests
        run: |
          set -e
          shopt -s nullglob globstar
          found=0
          for t in .claude/hooks/*.test.py docs/agents/*.test.py skills/**/*.test.py; do
            echo "== $t =="
            python3 -B "$t"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "no standalone self-tests found — gate would pass having tested nothing"
            exit 1
          fi

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff lint
        run: pipx run ruff==0.17.0 check .

  typecheck-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pyright (basic mode)
        run: pipx run pyright==1.1.414

  # Merge gate: the one CI check the default-branch ruleset requires. Always
  # runs; fails only when a needed job failed or was cancelled (skipped passes).
  ci-ok:
    if: always()
    needs: [gate, lint-python, typecheck-python]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
