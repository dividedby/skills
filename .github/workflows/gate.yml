name: gate

# Single always-run merge gate — the sole CI workflow for tests. The three
# per-area workflows this once complemented (hook-self-tests, harness-tests,
# apply-agent-research-lib-tests) were path-filtered subsets of this suite that
# also re-ran on push, double-running the same tests gate already covers at PR
# time; they were removed. This job has no path filter, runs every stdlib
# self-test in the repo in one sub-second pass, and is the single required check
# branch protection gates merges on.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Run all standalone self-tests
        run: |
          set -e
          shopt -s nullglob globstar
          found=0
          for t in .claude/hooks/*.test.py skills/**/*.test.py; do
            echo "== $t =="
            python3 -B "$t"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "no standalone self-tests found — gate would pass having tested nothing"
            exit 1
          fi

      - name: Run unittest suites
        run: |
          set -e
          python3 -m unittest discover -s harness/tests
          python3 -m unittest discover -s skills/meta/apply-agent-research/tests
          python3 -m unittest discover -s tools
