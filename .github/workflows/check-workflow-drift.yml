name: Check Workflow Drift

# Weekly divergence-detection guard for vendored Claude-powered workflow files
# (apply-agent-research.yml full-copy + reusable-loop caller stubs) across the
# five repos that run the proposal loops. Reads each consumer via the GitHub
# Contents API; checks structural anchors; opens a `workflow-drift` issue in
# dividedby/skills for any drifted repo. Report only — no hard gate, no auto-fix.
#
# Prerequisite: ISSUES_TOKEN secret (fine-grained PAT, owner dividedby, all repos,
# permissions: Contents:Read + Issues:Write). Until the secret is created the job
# exits 0 and does nothing (graceful no-op; the script prints a clear notice to
# the log).
#
# Reference: docs/agents/vendored-workflows.md, tools/check_workflow_drift.py

on:
  schedule:
    # Sunday 04:00 UTC — outside all proposal-loop windows (Mon/Wed/Sat 00–04 UTC
    # and first-Monday 13:xx UTC), so this job never competes with live loop runs.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-workflow-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_workflow_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"
