name: Apply Agent Research

# Thin caller stub (ADR 0029). Body lives in apply-agent-research-reusable.yml.
# Local-path `./` ref means skills runs its own latest body (the canary) while
# consumers pin @claude-loops-v1.
# Cron: 01:19 UTC Mon/Wed/Sat = 20:19 CT Sun/Tue/Fri. 3×/week, in the evening consumer
# window — slot = sha1("skills/apply-agent-research") within the 00–04 UTC band,
# so onboarding a Consumer needs no schedule coordination (agent-research ADR 0022
# hash-stagger). The UTC slot rolls back one calendar day in CT (UTC−5):
# Mon/Wed/Sat UTC → Sun/Tue/Fri CT evening. Per-run cap reduced to ≤2 issues
# across all channels (ADR 0019, amended 2026-06-20; a ceiling, not a target);
# frequency raised to 3×/week to compensate.

on:
  schedule:
    - cron: "19 1 * * 1,3,6"
  workflow_dispatch:

jobs:
  run:
    # The calling job must grant the token scopes the reusable body needs: a
    # called workflow can't be granted more than the caller holds, and the repo
    # default is read-only — without this the body's `issues: write` request
    # exceeds the caller's grant and the run startup-fails.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/apply-agent-research-reusable.yml
    with:
      is-knowledge-source: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Host mode — SKILLS_TRACKER_TOKEN deliberately NOT passed; its absence is
      # the discriminator that puts the prompt in host mode (ADR 0015).
