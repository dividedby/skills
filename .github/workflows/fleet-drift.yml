name: Fleet Drift

# Weekly consolidated drift detection across three independent report-only
# checks against consumer/carrier repos: vendored workflow files, label-doc
# conventions, and idea-inbox.md structure. Each job reads via the GitHub
# Contents API and opens a drift issue in dividedby/skills for any drifted
# repo. Report only — no hard gate, no mutation of any other repo.
#
# Prerequisite: ISSUES_TOKEN secret (fine-grained PAT, owner dividedby, all repos,
# permissions: Contents:Read + Issues:Write). Until the secret is created each
# job exits 0 and does nothing (graceful no-op; the script prints a clear notice
# to the log).
#
# Reference: docs/agents/vendored-workflows.md, tools/check_workflow_drift.py,
# tools/check_label_drift.py, tools/check_idea_inbox_drift.py

on:
  schedule:
    # Sunday 04:00 UTC — outside all proposal-loop windows (Mon/Wed/Sat 00–04 UTC
    # and first-Monday 13:xx UTC), so this job never competes with live loop runs.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  workflow-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_workflow_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"

  label-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run label drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_label_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"

  idea-inbox-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run idea-inbox drift check
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/check_idea_inbox_drift.py \
            --read-token "$ISSUES_TOKEN" \
            --write-token "$GITHUB_TOKEN"
